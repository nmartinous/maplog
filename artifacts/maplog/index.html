<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Maplog</title>
    <meta name="description" content="Maplog — Soundmap Companion Archive" />
    <meta name="theme-color" content="#09090b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Maplog" />
    <!-- Inline dark background — prevents white flash before CSS loads on iOS PWA launch -->
    <style>html,body{background-color:#09090b;color-scheme:dark;}</style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <!-- Required by Deezer SDK for its internal player widget (hidden — we use HTML5 audio) -->
    <div id="dz-root" style="display:none;position:absolute;width:0;height:0;"></div>
    <!-- Deezer JS SDK — loaded after dz-root so it can find the div on init -->
    <script src="https://e-cdns-files.dzcdn.net/js/min/dz.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
