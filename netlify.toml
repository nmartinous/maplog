[build]
  command   = "pnpm --filter @workspace/maplog run build"
  publish   = "artifacts/maplog/dist/public"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "10.26.1"
  BASE_PATH    = "/"
  NODE_ENV     = "production"
  PORT         = "3000"

# Non-function API routes → 404 (prevents SPA from serving index.html for /api/*)
[[redirects]]
  from   = "/api/*"
  to     = "/404.html"
  status = 404
  force  = true

# SPA fallback — non-API routes serve index.html
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
